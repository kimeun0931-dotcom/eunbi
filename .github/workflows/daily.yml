name: 매일 아침 업데이트

on:
  schedule:
    - cron: "30 21 * * 1-5"   # UTC 21:30 = 한국 시간 화~토 06:30 (미국 마감 후, 한국 출근 전)
  workflow_dispatch:           # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance requests lxml anthropic
      - name: 시세·차트 수집 (무료)
        run: python scripts/update_data.py
      - name: 이슈·이유 작성 (API 키가 있을 때만)
        if: env.ANTHROPIC_API_KEY != ''
        run: python scripts/generate_editorial.py
      - name: 변경사항 커밋
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "daily update $(date -u +%F)"
          git push
